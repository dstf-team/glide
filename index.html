<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>System Terminal</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    color: #d0d0d0;

    font-family:
        "Courier New",
        Consolas,
        monospace;

}

#terminal {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    padding: 8px 12px;

    background: #000;

    overflow: hidden;

}

#output {

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-size: 14px;

    line-height: 1.35;

    white-space: pre-wrap;

    word-break: break-all;

}


/* ==========================================
   BARIS TERMINAL
========================================== */

.line {

    display: block;

    width: 100%;

    min-height: 19px;

    white-space: pre-wrap;

    word-break: break-all;

    overflow: hidden;

}


/* ==========================================
   NORMAL
========================================== */

.normal {

    color: #cfcfcf;

}


/* ==========================================
   ERROR
========================================== */

.error {

    color: #ffffff;

    font-weight: bold;

}


/* ==========================================
   WARNING
========================================== */

.warning {

    color: #999999;

}


/* ==========================================
   CURSOR
========================================== */

.cursor {

    display: inline-block;

    width: 8px;

    height: 15px;

    background: #ccc;

    margin-left: 2px;

    vertical-align: middle;

    animation: blink .7s steps(1) infinite;

}

@keyframes blink {

    0%,
    50% {
        opacity: 1;
    }

    51%,
    100% {
        opacity: 0;
    }

}


/* ==========================================
   ERROR GLITCH HANYA PADA TEKS
========================================== */

.glitch {

    animation: textGlitch .08s steps(2) infinite;

}

@keyframes textGlitch {

    0% {
        opacity: 1;
    }

    50% {
        opacity: .45;
    }

    100% {
        opacity: 1;
    }

}


/* ==========================================
   SCANLINE
========================================== */

#scanline {

    position: fixed;

    left: 0;

    top: 0;

    width: 100%;

    height: 1px;

    background: #777;

    opacity: .08;

    pointer-events: none;

    animation: scan 5s linear infinite;

}

@keyframes scan {

    from {
        top: 0;
    }

    to {
        top: 100vh;
    }

}


/* ==========================================
   FULLSCREEN
========================================== */

:fullscreen {

    width: 100vw;
    height: 100vh;

    background: #000;

}


/* ==========================================
   HILANGKAN SCROLLBAR
========================================== */

::-webkit-scrollbar {
    display: none;
}

</style>

</head>


<body>


<div id="terminal">

    <div id="output"></div>

</div>

<div id="scanline"></div>


<script>


/* ==================================================
   ELEMENT
================================================== */

const output =
    document.getElementById("output");


/* ==================================================
   PESAN SISTEM NORMAL
================================================== */

const normalMessages = [

    "SYSTEM INITIALIZING",

    "SYSTEM STARTUP",

    "SYSTEM PROCESS RUNNING",

    "SYSTEM SERVICE RUNNING",

    "SYSTEM MONITOR ACTIVE",

    "SYSTEM CHECK",

    "PROCESS INITIALIZED",

    "PROCESS STARTED",

    "PROCESS RUNNING",

    "PROCESS MONITOR",

    "THREAD INITIALIZED",

    "THREAD RUNNING",

    "SERVICE STARTED",

    "SERVICE CHECK",

    "SERVICE RESPONSE",

    "REQUEST RECEIVED",

    "REQUEST PROCESSING",

    "REQUEST COMPLETED",

    "DATA PROCESSING",

    "DATA STREAM ACTIVE",

    "DATA TRANSMISSION",

    "DATA BUFFER CHECK",

    "NETWORK CHECK",

    "NETWORK SERVICE CHECK",

    "SERVER RESPONSE",

    "SERVER REQUEST",

    "CLIENT REQUEST",

    "CONNECTION CHECK",

    "DATABASE SERVICE CHECK",

    "DATABASE QUERY",

    "DATABASE TRANSACTION",

    "STORAGE CHECK",

    "FILE SYSTEM CHECK",

    "MEMORY ALLOCATION",

    "RESOURCE ALLOCATION",

    "RESOURCE CHECK",

    "BACKGROUND PROCESS",

    "PROCESS MONITORING",

    "CONNECTION MONITORING"

];


/* ==================================================
   SYSTEM ERROR
================================================== */

const systemErrors = [

    "SYSTEM ERROR",

    "SYSTEM FAILURE",

    "SYSTEM RESPONSE FAILURE",

    "FATAL SYSTEM ERROR",

    "CRITICAL SYSTEM ERROR",

    "SYSTEM INTERRUPTED",

    "SYSTEM RECOVERY FAILURE",

    "SYSTEM SERVICE FAILURE",

    "SYSTEM RESOURCE FAILURE",

    "SYSTEM HALTED",

    "SYSTEM PROCESS FAILURE",

    "SYSTEM PROCESS TERMINATED",

    "SYSTEM MEMORY ERROR",

    "SYSTEM IO FAILURE",

    "SYSTEM TIMEOUT"

];


/* ==================================================
   CONNECTION
================================================== */

const connectionErrors = [

    "NO CONNECTION",

    "CONNECTION FAILURE",

    "CONNECTION LOST",

    "CONNECTION TIMEOUT",

    "CONNECTION REFUSED",

    "REMOTE CONNECTION FAILED",

    "SERVER CONNECTION FAILURE",

    "SERVER NOT RESPONDING",

    "NETWORK FAILURE",

    "NETWORK CONNECTION FAILURE",

    "NETWORK TIMEOUT",

    "NETWORK UNREACHABLE",

    "HOST UNREACHABLE",

    "REMOTE HOST NOT FOUND",

    "SOCKET CONNECTION FAILURE",

    "SOCKET TIMEOUT",

    "TCP CONNECTION FAILED",

    "TCP SESSION LOST",

    "DNS RESOLUTION FAILED",

    "NETWORK SERVICE UNAVAILABLE"

];


/* ==================================================
   DATABASE
================================================== */

const databaseErrors = [

    "DATABASE ERROR",

    "DATABASE CORRUPTED",

    "DATABASE CONNECTION FAILURE",

    "DATABASE READ FAILURE",

    "DATABASE WRITE FAILURE",

    "DATABASE RESPONSE TIMEOUT",

    "DATABASE SERVICE UNAVAILABLE",

    "DATABASE INTEGRITY CHECK FAILED",

    "DATABASE TRANSACTION FAILED",

    "DATABASE QUERY FAILURE",

    "DATABASE LOCK FAILURE",

    "DATABASE RECOVERY FAILED",

    "INVALID DATABASE RESPONSE",

    "CORRUPTED DATABASE BLOCK"

];


/* ==================================================
   DATA
================================================== */

const dataErrors = [

    "DATA CORRUPTED",

    "DATA READ FAILURE",

    "DATA WRITE FAILURE",

    "DATA INTEGRITY FAILURE",

    "DATA VALIDATION FAILURE",

    "DATA STREAM INTERRUPTED",

    "DATA TRANSMISSION FAILURE",

    "DATA PACKET LOST",

    "DATA BUFFER ERROR",

    "DATA CHECKSUM FAILURE",

    "INVALID DATA RECEIVED",

    "CORRUPTED DATA BLOCK",

    "DATA RECOVERY FAILED"

];


/* ==================================================
   FILE / DISK
================================================== */

const fileErrors = [

    "FILE READ ERROR",

    "FILE WRITE ERROR",

    "FILE ACCESS FAILURE",

    "FILE CORRUPTED",

    "FILE NOT FOUND",

    "FILE SYSTEM ERROR",

    "STORAGE READ FAILURE",

    "STORAGE WRITE FAILURE",

    "DISK READ ERROR",

    "DISK WRITE ERROR",

    "INPUT OUTPUT FAILURE",

    "I/O DEVICE ERROR"

];


/* ==================================================
   RANDOM
================================================== */

function random(min, max) {

    return Math.floor(
        Math.random() *
        (max - min + 1)
    ) + min;

}


function pick(array) {

    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];

}


/* ==================================================
   HEX CODE
================================================== */

function hex() {

    return Math.floor(
        Math.random() *
        16777215
    )
    .toString(16)
    .toUpperCase()
    .padStart(6, "0");

}


/* ==================================================
   PID
================================================== */

function pid() {

    return random(
        1000,
        99999
    );

}


/* ==================================================
   RANDOM DATA
================================================== */

function randomData() {

    const chars =
        "0123456789ABCDEF";

    let result = "";

    const length =
        random(5, 22);

    for (
        let i = 0;
        i < length;
        i++
    ) {

        result +=
            chars[
                random(
                    0,
                    chars.length - 1
                )
            ];

    }

    return result;

}


/* ==================================================
   WAKTU
================================================== */

function time() {

    const now = new Date();

    return (

        now.getHours()
            .toString()
            .padStart(2, "0")

        + ":" +

        now.getMinutes()
            .toString()
            .padStart(2, "0")

        + ":" +

        now.getSeconds()
            .toString()
            .padStart(2, "0")

    );

}


/* ==================================================
   BUAT PESAN
================================================== */

function createMessage() {

    const r =
        Math.random();

    let message;

    let type =
        "normal";


    /* NORMAL */

    if (r < 0.58) {

        message =
            pick(normalMessages);

    }


    /* SYSTEM ERROR */

    else if (r < 0.68) {

        message =
            pick(systemErrors);

        type =
            "error";

    }


    /* CONNECTION */

    else if (r < 0.78) {

        message =
            pick(connectionErrors);

        type =
            "error";

    }


    /* DATABASE */

    else if (r < 0.88) {

        message =
            pick(databaseErrors);

        type =
            "error";

    }


    /* DATA */

    else if (r < 0.95) {

        message =
            pick(dataErrors);

        type =
            "error";

    }


    /* FILE */

    else {

        message =
            pick(fileErrors);

        type =
            "error";

    }


    return {
        message,
        type
    };

}


/* ==================================================
   BUAT SATU BARIS
================================================== */

function addLine() {

    const data =
        createMessage();


    const line =
        document.createElement(
            "div"
        );


    line.className =
        "line " +
        data.type;


    /* ===============================================
       FORMAT TERMINAL
    =============================================== */

    let text =

        "[" +
        time() +
        "] " +

        "[PID:" +
        pid() +
        "] " +

        data.message;


    /* ===============================================
       TAMBAHAN
    =============================================== */

    const r =
        Math.random();


    if (r < 0.30) {

        text +=

            " | CODE:0x" +
            hex();

    }

    else if (r < 0.50) {

        text +=

            " | DATA:" +
            randomData();

    }

    else if (r < 0.65) {

        text +=

            " | STATUS:" +

            (
                data.type === "error"
                ? "FAILED"
                : "RUNNING"
            );

    }

    else if (r < 0.75) {

        text +=

            " | RETRY:" +
            random(1, 9);

    }


    line.textContent =
        text;


    /* ===============================================
       ERROR GLITCH JARANG
    =============================================== */

    if (
        data.type === "error" &&
        Math.random() < 0.07
    ) {

        line.classList.add(
            "glitch"
        );

    }


    /* ===============================================
       MASUKKAN KE TERMINAL
    =============================================== */

    output.appendChild(
        line
    );


    /* ===============================================
       BATASI LOG
    =============================================== */

    while (
        output.children.length > 180
    ) {

        output.removeChild(
            output.firstElementChild
        );

    }

}


/* ==================================================
   ISI LAYAR DULU
================================================== */

for (
    let i = 0;
    i < 100;
    i++
) {

    addLine();

}


/* ==================================================
   TERMINAL BERJALAN
================================================== */

function runTerminal() {

    /*
       Tambahkan beberapa baris sekaligus.
       TIDAK ADA ANIMASI X.
       TIDAK ADA TRANSLATE.
       TIDAK ADA GLIDE SAMPING.
    */

    const amount =
        random(1, 4);


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        addLine();

    }

}


/* ==================================================
   JALANKAN TERUS
================================================== */

setInterval(
    runTerminal,
    100
);


/* ==================================================
   DOUBLE CLICK FULLSCREEN
================================================== */

document.addEventListener(
    "dblclick",
    async function () {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document
                    .documentElement
                    .requestFullscreen();

            }

        }
        catch (e) {

            console.log(e);

        }

    }
);

</script>

</body>
</html>
