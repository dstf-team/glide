<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>...</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            padding: 10px;

            /* Full screen */
            width: 100vw;
            height: 100vh;

            /* Mencegah seleksi */
            user-select: none;

            /* Efek zoom */
            transform-origin: center center;
        }

        #screen {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background: #000;
        }

        #output {
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.6;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }

        /* =========================
           ERROR MERAH
        ========================= */

        .error-text {
            color: #ff0040;
            text-shadow:
                0 0 5px #ff0040,
                0 0 10px #ff0040;
        }

        .error-blink {
            animation: blink 0.5s infinite;
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        /* =========================
           EFEK ZOOM TERUS MENERUS
        ========================= */

        #screen {
            animation: screenZoom 0.8s infinite alternate ease-in-out;
            transform-origin: center center;
        }

        @keyframes screenZoom {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.03);
            }

            100% {
                transform: scale(1.08);
            }

        }

        /* =========================
           GLITCH
        ========================= */

        .glitch {
            animation:
                glitchX 0.15s infinite,
                screenZoom 0.8s infinite alternate ease-in-out;
        }

        @keyframes glitchX {

            0% {
                left: 0;
            }

            25% {
                left: -2px;
            }

            50% {
                left: 2px;
            }

            75% {
                left: -1px;
            }

            100% {
                left: 0;
            }

        }

        /* =========================
           TOMBOL FULLSCREEN
        ========================= */

        #fullscreenBtn {
            position: fixed;

            top: 15px;
            right: 15px;

            z-index: 99999;

            background: #000;
            color: #00ff00;

            border: 1px solid #00ff00;

            padding: 8px 14px;

            font-family: 'Courier New', monospace;
            font-size: 12px;

            cursor: pointer;

            box-shadow:
                0 0 5px #00ff00,
                inset 0 0 5px #00ff00;
        }

        #fullscreenBtn:hover {
            background: #00ff00;
            color: #000;
        }

        /* Sembunyikan scrollbar */
        ::-webkit-scrollbar {
            display: none;
        }

        /* =========================
           SAAT FULLSCREEN
        ========================= */

        :fullscreen {
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        :-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            background: #000;
        }

    </style>
</head>

<body>

<div id="screen">

    <div id="output"></div>

</div>

<button id="fullscreenBtn">
    [ FULLSCREEN ]
</button>


<script>

// ========================================
// FULLSCREEN
// ========================================

const fullscreenBtn =
    document.getElementById('fullscreenBtn');

fullscreenBtn.addEventListener('click', async () => {

    try {

        if (!document.fullscreenElement) {

            await document.documentElement.requestFullscreen();

            fullscreenBtn.innerHTML = '[ EXIT FULLSCREEN ]';

        } else {

            await document.exitFullscreen();

            fullscreenBtn.innerHTML = '[ FULLSCREEN ]';

        }

    } catch (error) {

        console.log('Fullscreen tidak tersedia:', error);

    }

});


// ========================================
// UPDATE STATUS FULLSCREEN
// ========================================

document.addEventListener('fullscreenchange', () => {

    if (document.fullscreenElement) {

        fullscreenBtn.innerHTML =
            '[ EXIT FULLSCREEN ]';

    } else {

        fullscreenBtn.innerHTML =
            '[ FULLSCREEN ]';

    }

});


// ========================================
// DATA KARAKTER
// ========================================

const chars = [
    '!','@','#','$','%','^','&','*','(',')','_','+','=','{','}','[',']',
    '|','\\',';',':','"','<','>',',','.','?','/','~','`','¡','¢','£',
    '¤','¥','¦','§','¨','©','ª','«','¬','®','¯','°','±','²','³','´',
    'µ','¶','·','¸','¹','º','»','¼','½','¾','¿','×','÷','ø','þ','ÿ',
    'Œ','œ','Š','š','Ÿ','Ž','ž','ƒ','ˆ','˜','–','—','‘','’','‚','“',
    '”','„','†','‡','•','…','‰','€','™','←','↑','→','↓','↔','↕','↖',
    '↗','↘','↙','↚','↛','↜','↝','↞','↟','↠','↡','↢','↣','↤','↥','↦',
    '↧','↨','↩','↪','↫','↬','↭','↮','↯','↰','↱','↲','↳','↴','↵','↶',
    '↷','↸','↹','↺','↻','⇄','⇅','⇆','⇇','⇈','⇉','⇊','⇋','⇌','⇍','⇎',
    '⇏','⇐','⇑','⇒','⇓','⇔','⇕','⇖','⇗','⇘','⇙','⇚','⇛','⇜','⇝','⇞',
    '⇟','⇠','⇡','⇢','⇣','⇤','⇥','⇦','⇧','⇨','⇩','⇪','⇫','⇬','⇭','⇮',
    '⇯','⇰','⇱','⇲','⇳','⇴','⇵','⇶','⇷','⇸','⇹','⇺','⇻','⇼','⇽','⇾',
    '⇿','∀','∂','∃','∅','∇','∈','∉','∊','∋','∌','∍','∎','∏','∐','∑',
    '−','∓','∔','∕','∖','∗','∘','∙','√','∛','∜','∝','∞','∟','∠','∡',
    '∢','∣','∤','∥','∦','∧','∨','∩','∪','∫','∬','∭','∮','∯','∰','∱',
    '∲','∳','∴','∵','∶','∷','∸','∹','∺','∻','∼','∽','∾','∿','≀','≁',
    '≂','≃','≄','≅','≆','≇','≈','≉','≊','≋','≌','≍','≎','≏','≐','≑'
];

const hex = '0123456789ABCDEF';

const bin = '01';

const letters =
    'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';


// ========================================
// PESAN ERROR
// ========================================

const errorMessages = [

    '⚠️ SYSTEM ERROR 0x3F1A',
    '💀 CRITICAL FAILURE',
    '🔥 UNAUTHORIZED ACCESS',
    '⚡ DATA CORRUPTED',
    '📡 CONNECTION LOST',
    '🌀 KERNEL PANIC',
    '☠️ VIRUS DETECTED',
    '💢 BUFFER OVERFLOW',
    '🔴 SECURITY BREACH',
    '⚠️ FATAL EXCEPTION',
    '💀 MEMORY DUMP FAILED',
    '🔥 FIREWALL BYPASSED',
    '⚡ SYSTEM HALTED',
    '📡 ENCRYPTION FAILED',
    '🌀 DATABASE CORRUPTED',
    '⚠️ BOOT SECTOR DAMAGED',
    '💀 SEGFAULT 0x7F3E',
    '🔥 ROOTKIT INSTALLED',
    '⚡ POWER SURGE DETECTED',
    '📡 NETWORK INFECTED'

];


// ========================================
// OUTPUT
// ========================================

const output =
    document.getElementById('output');

let buffer = '';


// ========================================
// GENERATE
// ========================================

function generateBatch() {

    let batch = '';

    const lines =
        50 + Math.floor(Math.random() * 100);

    let errorInserted = false;


    for (let i = 0; i < lines; i++) {

        const len =
            40 + Math.floor(Math.random() * 80);

        let line = '';


        // RANDOM TEXT

        for (let j = 0; j < len; j++) {

            const r = Math.random();

            if (r < 0.3) {

                line +=
                    chars[
                        Math.floor(
                            Math.random() *
                            chars.length
                        )
                    ];

            }

            else if (r < 0.5) {

                line +=
                    hex[
                        Math.floor(
                            Math.random() * 16
                        )
                    ];

            }

            else if (r < 0.65) {

                line +=
                    bin[
                        Math.floor(
                            Math.random() * 2
                        )
                    ];

            }

            else if (r < 0.8) {

                line +=
                    letters[
                        Math.floor(
                            Math.random() *
                            letters.length
                        )
                    ];

            }

            else {

                line +=
                    Math.floor(
                        Math.random() * 10
                    );

            }

        }


        // ========================================
        // ERROR
        // ========================================

        if (
            Math.random() < 0.035 &&
            !errorInserted
        ) {

            const msg =
                errorMessages[
                    Math.floor(
                        Math.random() *
                        errorMessages.length
                    )
                ];


            const errorCode =
                ' [0x' +
                Math.floor(
                    Math.random() * 65535
                )
                .toString(16)
                .toUpperCase() +
                ']';


            const pos =
                Math.floor(
                    Math.random() *
                    Math.max(
                        1,
                        len - msg.length
                    )
                );


            const before =
                line.substring(0, pos);

            const after =
                line.substring(pos);


            line =
                before +
                ' ' +
                msg +
                errorCode +
                ' ' +
                after;


            errorInserted = true;

        }


        // ========================================
        // ERROR CODE
        // ========================================

        if (
            Math.random() < 0.05 &&
            !errorInserted
        ) {

            const codes = [

                ' [ERR 0x' +
                Math.floor(
                    Math.random() * 65535
                )
                .toString(16)
                .toUpperCase() +
                ']',


                ' [FAIL 0x' +
                Math.floor(
                    Math.random() * 65535
                )
                .toString(16)
                .toUpperCase() +
                ']',


                ' [SEGV 0x' +
                Math.floor(
                    Math.random() * 65535
                )
                .toString(16)
                .toUpperCase() +
                ']',


                ' [BUS 0x' +
                Math.floor(
                    Math.random() * 65535
                )
                .toString(16)
                .toUpperCase() +
                ']',


                ' [SIG' +
                Math.floor(
                    Math.random() * 31 + 1
                ) +
                ']'

            ];


            line +=
                codes[
                    Math.floor(
                        Math.random() *
                        codes.length
                    )
                ];


            errorInserted = true;

        }


        batch += line + '\n';

    }


    // ========================================
    // ERROR BATCH
    // ========================================

    if (Math.random() < 0.02) {

        batch +=
            '\n' +
            '='.repeat(60) +
            '\n';


        batch +=
            '⚠️ ' +
            errorMessages[
                Math.floor(
                    Math.random() *
                    errorMessages.length
                )
            ] +
            ' [0x' +
            Math.floor(
                Math.random() * 65535
            )
            .toString(16)
            .toUpperCase() +
            ']\n';


        batch +=
            '='.repeat(60) +
            '\n';

    }


    buffer += batch;


    // ========================================
    // BATASI BUFFER
    // ========================================

    if (buffer.length > 500000) {

        buffer =
            buffer.substring(
                buffer.length - 250000
            );

    }


    displayWithErrors(buffer);

}


// ========================================
// DISPLAY
// ========================================

function displayWithErrors(text) {

    const lines =
        text.split('\n');

    let html = '';


    for (let line of lines) {

        if (
            line.includes('ERROR') ||
            line.includes('FAIL') ||
            line.includes('SEGV') ||
            line.includes('ERR') ||
            line.includes('SIG') ||
            line.includes('CRITICAL') ||
            line.includes('KERNEL') ||
            line.includes('VIRUS') ||
            line.includes('BREACH') ||
            line.includes('PANIC') ||
            line.includes('HALTED') ||
            line.includes('CORRUPTED')
        ) {

            const blink =
                Math.random() < 0.3
                ? ' error-blink'
                : '';


            html +=
                `<div class="error-text${blink}">` +
                `${escapeHtml(line)}` +
                `</div>`;

        }

        else {

            html +=
                `<div>${escapeHtml(line)}</div>`;

        }

    }


    output.innerHTML = html;

}


// ========================================
// ESCAPE HTML
// ========================================

function escapeHtml(text) {

    const div =
        document.createElement('div');

    div.textContent = text;

    return div.innerHTML;

}


// ========================================
// JALANKAN TERUS
// ========================================

setInterval(
    generateBatch,
    100
);


// ========================================
// GENERATE AWAL
// ========================================

for (let i = 0; i < 20; i++) {

    generateBatch();

}

</script>

</body>
</html>
