<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>System Failure</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


/* =====================================================
   FULL VIEWPORT
===================================================== */

html,
body{

    width:100%;
    height:100%;

    min-width:100%;
    min-height:100%;

    overflow:hidden;

    background:#000;

    color:#fff;

    font-family:
        "Courier New",
        monospace;

}


/* =====================================================
   SCREEN
===================================================== */

#screen{

    position:fixed;

    left:0;
    top:0;

    width:100vw;
    height:100vh;

    min-width:100vw;
    min-height:100vh;

    overflow:hidden;

    background:#000;

}


/* =====================================================
   CONTAINER
===================================================== */

#terminal{

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    overflow:hidden;

}


/* =====================================================
   BARIS GLIDE
===================================================== */

.line{

    position:absolute;

    left:0;

    width:max-content;

    max-width:none;

    white-space:nowrap;

    color:#fff;

    font-weight:normal;

    line-height:1;

    opacity:.95;

    will-change:transform;

    text-shadow:
        0 0 2px #fff;

}


/* =====================================================
   GLIDE KIRI
===================================================== */

.left{

    animation:
        moveLeft
        var(--duration)
        linear
        infinite;

}


/* =====================================================
   GLIDE KANAN
===================================================== */

.right{

    animation:
        moveRight
        var(--duration)
        linear
        infinite;

}


@keyframes moveLeft{

    from{
        transform:
        translateX(100vw);
    }

    to{
        transform:
        translateX(-120%);
    }

}


@keyframes moveRight{

    from{
        transform:
        translateX(-120%);
    }

    to{
        transform:
        translateX(100vw);
    }

}


/* =====================================================
   GLITCH LINE
===================================================== */

.glitch{

    animation:
        glitch
        .12s
        infinite;

}


@keyframes glitch{

    0%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-8px);
    }

    50%{
        transform:translateX(7px);
    }

    75%{
        transform:translateX(-4px);
    }

    100%{
        transform:translateX(0);
    }

}


/* =====================================================
   ERROR BESAR
===================================================== */

.big-error{

    position:absolute;

    z-index:50;

    color:#fff;

    font-weight:bold;

    white-space:nowrap;

    text-shadow:
        0 0 4px #fff,
        0 0 10px #fff;

    animation:
        bigGlitch
        .15s
        infinite;

}


@keyframes bigGlitch{

    0%{
        transform:
        translate(0,0);
    }

    20%{
        transform:
        translate(-12px,4px);
    }

    40%{
        transform:
        translate(10px,-3px);
    }

    60%{
        transform:
        translate(-6px,2px);
    }

    80%{
        transform:
        translate(8px,-4px);
    }

    100%{
        transform:
        translate(0,0);
    }

}


/* =====================================================
   FLASH
===================================================== */

#flash{

    position:fixed;

    inset:0;

    z-index:999;

    background:#fff;

    pointer-events:none;

    opacity:0;

}


.flash{

    animation:
        flash
        .15s
        linear;

}


@keyframes flash{

    0%{
        opacity:.8;
    }

    100%{
        opacity:0;
    }

}


/* =====================================================
   SCANLINE
===================================================== */

#scanline{

    position:fixed;

    left:0;

    top:-5px;

    width:100%;

    height:2px;

    background:#fff;

    opacity:.12;

    z-index:1000;

    pointer-events:none;

    animation:
        scan
        2s
        linear
        infinite;

}


@keyframes scan{

    from{
        top:-5px;
    }

    to{
        top:100vh;
    }

}


/* =====================================================
   HILANGKAN SCROLLBAR
===================================================== */

::-webkit-scrollbar{
    display:none;
}


/* =====================================================
   FULLSCREEN
===================================================== */

:fullscreen{

    width:100vw;
    height:100vh;

    background:#000;

}

</style>

</head>


<body>


<div id="screen">

    <div id="terminal"></div>

</div>


<div id="flash"></div>

<div id="scanline"></div>


<script>


/* =====================================================
   ELEMENT
===================================================== */

const terminal =
document.getElementById("terminal");

const flash =
document.getElementById("flash");


/* =====================================================
   PESAN ERROR
===================================================== */

const messages = [

    "NO CONNECTION",

    "CONNECTION FAILURE",

    "CONNECTION LOST",

    "CONNECTION TIMEOUT",

    "NETWORK FAILURE",

    "NETWORK CONNECTION FAILED",

    "DATABASE CORRUPTED",

    "DATABASE CONNECTION FAILURE",

    "DATABASE READ FAILURE",

    "DATABASE WRITE FAILURE",

    "DATA CORRUPTED",

    "DATA INTEGRITY FAILURE",

    "DATA READ ERROR",

    "DATA WRITE ERROR",

    "DATA STREAM INTERRUPTED",

    "DATA TRANSMISSION FAILURE",

    "PACKET LOST",

    "PACKET TRANSMISSION FAILED",

    "PACKET TIMEOUT",

    "SERVER NOT RESPONDING",

    "SERVER CONNECTION FAILURE",

    "REMOTE HOST NOT FOUND",

    "HOST CONNECTION REFUSED",

    "NETWORK TIMEOUT",

    "REQUEST TIMEOUT",

    "REQUEST FAILED",

    "RESPONSE FAILURE",

    "INVALID RESPONSE",

    "INVALID DATA",

    "CORRUPTED PACKET",

    "MEMORY ERROR",

    "MEMORY READ FAILURE",

    "MEMORY WRITE FAILURE",

    "BUFFER OVERFLOW",

    "BUFFER UNDERFLOW",

    "SYSTEM FAILURE",

    "SYSTEM ERROR",

    "SYSTEM INTERRUPTED",

    "SYSTEM RESPONSE FAILURE",

    "PROCESS FAILURE",

    "PROCESS TERMINATED",

    "PROCESS NOT RESPONDING",

    "KERNEL ERROR",

    "KERNEL PANIC",

    "FATAL EXCEPTION",

    "FATAL SYSTEM ERROR",

    "UNEXPECTED ERROR",

    "UNKNOWN ERROR",

    "ACCESS DENIED",

    "PERMISSION DENIED",

    "AUTHENTICATION FAILURE",

    "AUTHORIZATION FAILURE",

    "SECURITY CHECK FAILURE",

    "PROTOCOL ERROR",

    "PROTOCOL FAILURE",

    "HANDSHAKE FAILURE",

    "SOCKET ERROR",

    "SOCKET CONNECTION LOST",

    "TCP CONNECTION FAILED",

    "IP CONNECTION FAILURE",

    "DNS RESOLUTION FAILED",

    "HOST UNREACHABLE",

    "SERVICE UNAVAILABLE",

    "SERVICE FAILURE",

    "FILE NOT FOUND",

    "FILE READ FAILURE",

    "FILE WRITE FAILURE",

    "FILE CORRUPTED",

    "STORAGE FAILURE",

    "DISK READ ERROR",

    "DISK WRITE ERROR",

    "IO ERROR",

    "INPUT OUTPUT FAILURE",

    "OPERATION FAILED",

    "OPERATION INTERRUPTED",

    "EXECUTION FAILURE",

    "COMMAND FAILURE",

    "RESOURCE NOT AVAILABLE",

    "RESOURCE FAILURE",

    "SYSTEM HALTED",

    "SYSTEM RECOVERY FAILED",

    "RECOVERY FAILURE",

    "BACKUP FAILURE",

    "RESTORE FAILURE",

    "ENCRYPTION FAILURE",

    "DECRYPTION FAILURE",

    "HASH VERIFICATION FAILED",

    "CHECKSUM ERROR",

    "SIGNATURE VERIFICATION FAILED",

    "INVALID SESSION",

    "SESSION EXPIRED",

    "SESSION CONNECTION LOST",

    "SERVICE CONNECTION LOST"

];


/* =====================================================
   KARAKTER ABSURD
===================================================== */

const symbols =

"!@#$%^&*()_+-=[]{}|;:',.<>?/\\~`" +

"0123456789" +

"ABCDEFGHIJKLMNOPQRSTUVWXYZ" +

"abcdefghijklmnopqrstuvwxyz" +

"∆∑∂∫∞≠≈√Ωλµ" +

"←↑→↓↔⇄⇅" +

"░▒▓█";


/* =====================================================
   RANDOM
===================================================== */

function random(min,max){

    return Math.floor(
        Math.random() *
        (max-min+1)
    ) + min;

}


function pick(arr){

    return arr[
        Math.floor(
            Math.random()*arr.length
        )
    ];

}


/* =====================================================
   ABSURD TEXT
===================================================== */

function randomNoise(length){

    let result="";

    for(
        let i=0;
        i<length;
        i++
    ){

        result +=
            symbols[
                Math.floor(
                    Math.random() *
                    symbols.length
                )
            ];

    }

    return result;

}


/* =====================================================
   RANDOM ERROR CODE
===================================================== */

function errorCode(){

    const code =
        Math.floor(
            Math.random() *
            16777215
        )
        .toString(16)
        .toUpperCase();

    return " [0x" + code + "]";

}


/* =====================================================
   BUAT ISI BARIS
===================================================== */

function createContent(){

    const mode =
        Math.random();


    let text="";


    /* ================================================
       ERROR
    ================================================ */

    if(mode < .45){

        text =
            pick(messages) +
            errorCode();

    }


    /* ================================================
       ERROR + ABSURD
    ================================================ */

    else if(mode < .75){

        text =
            pick(messages) +
            " " +
            randomNoise(
                random(20,80)
            );

    }


    /* ================================================
       FULL ABSURD
    ================================================ */

    else{

        text =
            randomNoise(
                random(60,180)
            );

    }


    return text;

}


/* =====================================================
   BUAT BARIS
===================================================== */

function createLine(index){

    const line =
        document.createElement("div");


    line.className =
        "line";


    line.textContent =
        createContent();


    /* ================================================
       POSISI VERTIKAL
    ================================================ */

    const y =
        (index / 70) * 100;


    line.style.top =
        y + "vh";


    /* ================================================
       RANDOM FONT
    ================================================ */

    line.style.fontSize =
        random(9,18) + "px";


    /* ================================================
       RANDOM OPACITY
    ================================================ */

    line.style.opacity =
        (random(55,100)/100);


    /* ================================================
       RANDOM PANJANG
    ================================================ */

    line.style.minWidth =
        random(120,280) + "vw";


    /* ================================================
       RANDOM SPEED
    ================================================ */

    line.style.setProperty(

        "--duration",

        random(4,14) + "s"

    );


    /* ================================================
       RANDOM ARAH
    ================================================ */

    if(
        Math.random() < .5
    ){

        line.classList.add(
            "left"
        );

    }

    else{

        line.classList.add(
            "right"
        );

    }


    /* ================================================
       GLITCH RANDOM
    ================================================ */

    if(
        Math.random() < .18
    ){

        line.classList.add(
            "glitch"
        );

    }


    terminal.appendChild(
        line
    );


    /* ================================================
       HAPUS DAN BUAT ULANG
    ================================================ */

    setTimeout(

        ()=>{

            line.remove();

            createLine(index);

        },

        random(5000,15000)

    );

}


/* =====================================================
   BUAT 75 BARIS
===================================================== */

for(
    let i=0;
    i<75;
    i++
){

    createLine(i);

}


/* =====================================================
   ERROR BESAR
===================================================== */

function bigError(){

    const el =
        document.createElement(
            "div"
        );


    el.className =
        "big-error";


    el.textContent =
        pick(messages);


    el.style.left =
        random(5,60) + "vw";


    el.style.top =
        random(10,85) + "vh";


    el.style.fontSize =
        random(22,60) + "px";


    terminal.appendChild(
        el
    );


    setTimeout(

        ()=>{

            el.remove();

        },

        random(
            400,
            1400
        )

    );

}


/* =====================================================
   ERROR BESAR BERKALA
===================================================== */

setInterval(

    ()=>{

        if(
            Math.random() < .7
        ){

            bigError();

        }

    },

    900

);


/* =====================================================
   FLASH RANDOM
===================================================== */

setInterval(

    ()=>{

        if(
            Math.random() < .08
        ){

            flash.classList.remove(
                "flash"
            );

            void flash.offsetWidth;

            flash.classList.add(
                "flash"
            );

        }

    },

    700

);


/* =====================================================
   FULLSCREEN
===================================================== */

document.addEventListener(
    "dblclick",
    async ()=>{

        try{

            if(
                !document.fullscreenElement
            ){

                await
                document
                .documentElement
                .requestFullscreen();

            }

        }

        catch(e){

            console.log(e);

        }

    }
);


/* =====================================================
   F11 / FULLSCREEN CHANGE
===================================================== */

document.addEventListener(
    "fullscreenchange",
    ()=>{

        document.body.style.width =
            "100vw";

        document.body.style.height =
            "100vh";

    }
);


</script>

</body>

</html>
