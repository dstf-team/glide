<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>System Terminal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;

    color:#d8d8d8;

    font-family:
        "Courier New",
        Consolas,
        monospace;

}

#terminal{

    position:fixed;

    left:0;
    top:0;

    width:100vw;
    height:100vh;

    padding:8px 12px;

    overflow:hidden;

    background:#000;

}

#output{

    width:100%;
    height:100%;

    overflow:hidden;

    white-space:pre-wrap;

    word-break:break-all;

    font-size:14px;

    line-height:1.35;

}


/* =====================================
   NORMAL
===================================== */

.normal{

    color:#d8d8d8;

}


/* =====================================
   ERROR
===================================== */

.error{

    color:#fff;

    font-weight:bold;

}


/* =====================================
   WARNING
===================================== */

.warning{

    color:#aaa;

}


/* =====================================
   GLITCH
===================================== */

.glitch{

    animation:
    glitch .12s infinite;

}

@keyframes glitch{

    0%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-2px);
    }

    50%{
        transform:translateX(2px);
    }

    75%{
        transform:translateX(-1px);
    }

    100%{
        transform:translateX(0);
    }

}


/* =====================================
   CURSOR
===================================== */

#cursor{

    display:inline-block;

    width:8px;

    height:15px;

    background:#d8d8d8;

    margin-left:2px;

    animation:
    blink .7s infinite;

}

@keyframes blink{

    0%,50%{
        opacity:1;
    }

    51%,100%{
        opacity:0;
    }

}


/* =====================================
   SCANLINE TIPIS
===================================== */

#scanline{

    position:fixed;

    left:0;
    top:0;

    width:100%;

    height:1px;

    background:#777;

    opacity:.12;

    pointer-events:none;

    animation:
    scan 4s linear infinite;

}

@keyframes scan{

    from{
        top:0;
    }

    to{
        top:100vh;
    }

}


/* =====================================
   FULLSCREEN
===================================== */

:fullscreen{

    width:100vw;
    height:100vh;

    background:#000;

}


/* =====================================
   SCROLLBAR
===================================== */

::-webkit-scrollbar{
    display:none;
}

</style>

</head>

<body>


<div id="terminal">

    <div id="output"></div>

</div>

<div id="scanline"></div>


<script>


const output =
document.getElementById("output");


/* =================================================
   PESAN NORMAL
================================================= */

const normalMessages = [

"SYSTEM INITIALIZING",

"SYSTEM PROCESS STARTED",

"SYSTEM SERVICE RUNNING",

"SYSTEM MONITOR ACTIVE",

"SYSTEM RESOURCE CHECK",

"SYSTEM MEMORY CHECK",

"PROCESS INITIALIZED",

"PROCESS STARTED",

"PROCESS RUNNING",

"PROCESS MONITOR",

"THREAD INITIALIZED",

"THREAD RUNNING",

"SERVICE STARTED",

"SERVICE CHECK",

"SERVICE RESPONSE",

"REQUEST RECEIVED",

"REQUEST PROCESSING",

"REQUEST COMPLETED",

"DATA PROCESSING",

"DATA STREAM ACTIVE",

"DATA TRANSMISSION",

"DATA BUFFER CHECK",

"NETWORK CHECK",

"NETWORK SERVICE CHECK",

"SERVER RESPONSE",

"SERVER REQUEST",

"CLIENT REQUEST",

"CONNECTION CHECK",

"DATABASE SERVICE CHECK",

"DATABASE QUERY",

"DATABASE TRANSACTION",

"STORAGE CHECK",

"FILE SYSTEM CHECK",

"MEMORY ALLOCATION",

"RESOURCE ALLOCATION",

"RESOURCE CHECK",

"BACKGROUND PROCESS",

"PROCESS MONITORING",

"CONNECTION MONITORING"

];


/* =================================================
   ERROR
================================================= */

const errorMessages = [

"SYSTEM ERROR",

"SYSTEM FAILURE",

"SYSTEM RESPONSE FAILURE",

"FATAL SYSTEM ERROR",

"CRITICAL SYSTEM ERROR",

"PROCESS FAILURE",

"PROCESS TERMINATED",

"PROCESS NOT RESPONDING",

"PROCESS TIMEOUT",

"THREAD FAILURE",

"THREAD NOT RESPONDING",

"MEMORY ERROR",

"MEMORY ACCESS FAILURE",

"MEMORY READ FAILURE",

"MEMORY WRITE FAILURE",

"BUFFER OVERFLOW",

"RESOURCE ALLOCATION FAILURE",

"SERVICE FAILURE",

"SERVICE NOT AVAILABLE",

"SERVICE RESPONSE FAILURE",

"OPERATION FAILED",

"EXECUTION FAILURE",

"RECOVERY FAILURE",

"SYSTEM RECOVERY FAILED",

"SYSTEM INTERRUPTED",

"SYSTEM HALTED"

];


/* =================================================
   CONNECTION ERROR
================================================= */

const connectionErrors = [

"NO CONNECTION",

"CONNECTION FAILURE",

"CONNECTION LOST",

"CONNECTION TIMEOUT",

"CONNECTION REFUSED",

"REMOTE CONNECTION FAILED",

"SERVER CONNECTION FAILURE",

"SERVER NOT RESPONDING",

"NETWORK FAILURE",

"NETWORK CONNECTION FAILURE",

"NETWORK TIMEOUT",

"NETWORK UNREACHABLE",

"HOST UNREACHABLE",

"REMOTE HOST NOT FOUND",

"SOCKET CONNECTION FAILURE",

"SOCKET TIMEOUT",

"TCP CONNECTION FAILED",

"TCP SESSION LOST",

"DNS RESOLUTION FAILED",

"NETWORK SERVICE UNAVAILABLE"

];


/* =================================================
   DATABASE ERROR
================================================= */

const databaseErrors = [

"DATABASE ERROR",

"DATABASE CORRUPTED",

"DATABASE CONNECTION FAILURE",

"DATABASE READ FAILURE",

"DATABASE WRITE FAILURE",

"DATABASE RESPONSE TIMEOUT",

"DATABASE SERVICE UNAVAILABLE",

"DATABASE INTEGRITY CHECK FAILED",

"DATABASE TRANSACTION FAILED",

"DATABASE QUERY FAILURE",

"DATABASE LOCK FAILURE",

"DATABASE RECOVERY FAILED",

"INVALID DATABASE RESPONSE",

"CORRUPTED DATABASE BLOCK"

];


/* =================================================
   DATA ERROR
================================================= */

const dataErrors = [

"DATA CORRUPTED",

"DATA READ FAILURE",

"DATA WRITE FAILURE",

"DATA INTEGRITY FAILURE",

"DATA VALIDATION FAILURE",

"DATA STREAM INTERRUPTED",

"DATA TRANSMISSION FAILURE",

"DATA PACKET LOST",

"DATA BUFFER ERROR",

"DATA CHECKSUM FAILURE",

"INVALID DATA RECEIVED",

"CORRUPTED DATA BLOCK",

"DATA RECOVERY FAILED"

];


/* =================================================
   FILE ERROR
================================================= */

const fileErrors = [

"FILE READ ERROR",

"FILE WRITE ERROR",

"FILE ACCESS FAILURE",

"FILE CORRUPTED",

"FILE NOT FOUND",

"FILE SYSTEM ERROR",

"STORAGE READ FAILURE",

"STORAGE WRITE FAILURE",

"DISK READ ERROR",

"DISK WRITE ERROR",

"INPUT OUTPUT FAILURE",

"I/O DEVICE ERROR"

];


/* =================================================
   RANDOM
================================================= */

function random(min,max){

    return Math.floor(
        Math.random() *
        (max-min+1)
    ) + min;

}


function pick(array){

    return array[
        Math.floor(
            Math.random()*array.length
        )
    ];

}


/* =================================================
   RANDOM HEX
================================================= */

function hex(){

    return Math
        .floor(
            Math.random()*16777215
        )
        .toString(16)
        .toUpperCase()
        .padStart(6,"0");

}


/* =================================================
   RANDOM ID
================================================= */

function pid(){

    return random(
        1000,
        99999
    );

}


/* =================================================
   RANDOM DATA
================================================= */

function randomData(){

    const chars =
        "0123456789ABCDEF";

    let text="";

    const length =
        random(6,25);

    for(
        let i=0;
        i<length;
        i++
    ){

        text +=
            chars[
                random(
                    0,
                    chars.length-1
                )
            ];

    }

    return text;

}


/* =================================================
   TIME
================================================= */

function time(){

    const now =
        new Date();

    return (

        now
        .getHours()
        .toString()
        .padStart(2,"0")

        + ":" +

        now
        .getMinutes()
        .toString()
        .padStart(2,"0")

        + ":" +

        now
        .getSeconds()
        .toString()
        .padStart(2,"0")

    );

}


/* =================================================
   GENERATE SATU BARIS
================================================= */

function generateLine(){

    const roll =
        Math.random();


    let message;

    let type =
        "normal";


    /*
       60% NORMAL
    */

    if(
        roll < .60
    ){

        message =
            pick(
                normalMessages
            );

    }


    /*
       10% SYSTEM ERROR
    */

    else if(
        roll < .70
    ){

        message =
            pick(
                errorMessages
            );

        type =
            "error";

    }


    /*
       10% CONNECTION
    */

    else if(
        roll < .80
    ){

        message =
            pick(
                connectionErrors
            );

        type =
            "error";

    }


    /*
       10% DATABASE
    */

    else if(
        roll < .90
    ){

        message =
            pick(
                databaseErrors
            );

        type =
            "error";

    }


    /*
       10% DATA
    */

    else{

        message =
            pick(
                dataErrors
            );

        type =
            "error";

    }


    /* =========================================
       PREFIX
    ========================================= */

    let line =
        "[" +
        time() +
        "] ";


    line +=
        "[PID:" +
        pid() +
        "] ";


    line +=
        message;


    /* =========================================
       TAMBAHAN RANDOM
    ========================================= */

    const extra =
        Math.random();


    if(
        extra < .30
    ){

        line +=
            " | CODE:0x" +
            hex();

    }

    else if(
        extra < .55
    ){

        line +=
            " | DATA:" +
            randomData();

    }

    else if(
        extra < .70
    ){

        line +=
            " | STATUS:" +
            (
                type === "error"
                ? "FAILED"
                : "RUNNING"
            );

    }

    else if(
        extra < .80
    ){

        line +=
            " | RETRY:" +
            random(1,9);

    }


    return {
        text:line,
        type:type
    };

}


/* =================================================
   TAMPILKAN BARIS
================================================= */

function addLine(){

    const data =
        generateLine();


    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        data.text;


    div.className =
        data.type;


    /* =========================================
       ERROR GLITCH JARANG
    ========================================= */

    if(
        data.type === "error" &&
        Math.random() < .08
    ){

        div.classList.add(
            "glitch"
        );

    }


    output.appendChild(
        div
    );


    /* =========================================
       BATASI JUMLAH
    ========================================= */

    while(
        output.children.length > 180
    ){

        output.removeChild(
            output.firstElementChild
        );

    }


    /* =========================================
       TETAP DI BAGIAN PALING BAWAH
    ========================================= */

    output.scrollTop =
        output.scrollHeight;

}


/* =================================================
   ISI LAYAR AWAL
================================================= */

for(
    let i=0;
    i<100;
    i++
){

    addLine();

}


/* =================================================
   TERMINAL BERJALAN
================================================= */

setInterval(

    ()=>{

        /*
           1-4 baris setiap interval
           membuat terminal terlihat
           seperti proses yang sedang berjalan
        */

        const amount =
            random(1,4);


        for(
            let i=0;
            i<amount;
            i++
        ){

            addLine();

        }

    },

    random(
        60,
        140
    )

);


/* =================================================
   FULLSCREEN DENGAN DOUBLE CLICK
================================================= */

document.addEventListener(

    "dblclick",

    async ()=>{

        try{

            if(
                !document.fullscreenElement
            ){

                await
                document
                .documentElement
                .requestFullscreen();

            }

        }
        catch(e){

            console.log(e);

        }

    }

);

</script>

</body>

</html>
