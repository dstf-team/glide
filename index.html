<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>System Monitor</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;

    color:#d8d8d8;

    font-family:
        "Courier New",
        Consolas,
        monospace;

}


/* ==========================================
   SCREEN
========================================== */

#screen{

    position:fixed;

    inset:0;

    width:100vw;
    height:100vh;

    overflow:hidden;

    background:#000;

}


/* ==========================================
   LOG AREA
========================================== */

#logs{

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    overflow:hidden;

}


/* ==========================================
   BARIS LOG
========================================== */

.log{

    position:absolute;

    left:0;

    width:max-content;

    white-space:nowrap;

    font-size:
        clamp(10px,1vw,15px);

    line-height:1;

    color:#d5d5d5;

    opacity:.88;

    font-weight:normal;

    will-change:transform;

}


/* ==========================================
   LOG BERGERAK KIRI
========================================== */

.move-left{

    animation:
        moveLeft
        var(--speed)
        linear
        infinite;

}


@keyframes moveLeft{

    from{

        transform:
        translateX(100vw);

    }

    to{

        transform:
        translateX(-130%);

    }

}


/* ==========================================
   LOG BERGERAK KANAN
========================================== */

.move-right{

    animation:
        moveRight
        var(--speed)
        linear
        infinite;

}


@keyframes moveRight{

    from{

        transform:
        translateX(-130%);

    }

    to{

        transform:
        translateX(100vw);

    }

}


/* ==========================================
   ERROR
========================================== */

.error{

    color:#ffffff;

    font-weight:bold;

}


/* ==========================================
   WARNING
========================================== */

.warning{

    color:#bcbcbc;

}


/* ==========================================
   ERROR KEDIP HALUS
========================================== */

.flicker{

    animation:
        flicker
        .25s
        infinite;

}


@keyframes flicker{

    0%{
        opacity:1;
    }

    45%{
        opacity:.45;
    }

    70%{
        opacity:1;
    }

    100%{
        opacity:.65;
    }

}


/* ==========================================
   SYSTEM MESSAGE BESAR
========================================== */

.system-alert{

    position:absolute;

    z-index:100;

    color:#fff;

    font-weight:bold;

    font-size:
        clamp(
            18px,
            3vw,
            45px
        );

    white-space:nowrap;

    text-shadow:
        0 0 5px #fff;

    animation:
        alertGlitch
        .12s
        infinite;

}


@keyframes alertGlitch{

    0%{
        transform:translate(0);
    }

    25%{
        transform:translate(-5px,1px);
    }

    50%{
        transform:translate(4px,-1px);
    }

    75%{
        transform:translate(-2px,2px);
    }

    100%{
        transform:translate(0);
    }

}


/* ==========================================
   SCAN
========================================== */

#scan{

    position:fixed;

    left:0;
    top:-3px;

    width:100%;

    height:1px;

    background:#777;

    opacity:.15;

    pointer-events:none;

    animation:
        scan
        3s
        linear
        infinite;

}


@keyframes scan{

    from{
        top:0;
    }

    to{
        top:100vh;
    }

}


/* ==========================================
   FULLSCREEN
========================================== */

:fullscreen{

    width:100vw;
    height:100vh;

    background:#000;

}


/* ==========================================
   HILANGKAN SCROLL
========================================== */

::-webkit-scrollbar{
    display:none;
}

</style>

</head>


<body>


<div id="screen">

    <div id="logs"></div>

</div>


<div id="scan"></div>


<script>


/* =================================================
   ELEMENT
================================================= */

const logs =
document.getElementById("logs");


/* =================================================
   ERROR SYSTEM
================================================= */

const errors = [

    "SYSTEM ERROR",

    "SYSTEM FAILURE",

    "SYSTEM RESPONSE FAILURE",

    "SYSTEM PROCESS ERROR",

    "SYSTEM RESOURCE FAILURE",

    "CRITICAL SYSTEM ERROR",

    "FATAL SYSTEM ERROR",

    "SYSTEM INTERRUPTED",

    "SYSTEM RECOVERY FAILURE",

    "SYSTEM SERVICE FAILURE",

    "SYSTEM HALTED",

    "SYSTEM PROCESS TERMINATED",

    "SYSTEM RESOURCE NOT AVAILABLE",

    "SYSTEM MEMORY ERROR",

    "SYSTEM IO FAILURE",

    "SYSTEM TIMEOUT"

];


/* =================================================
   CONNECTION
================================================= */

const connections = [

    "NO CONNECTION",

    "CONNECTION FAILURE",

    "CONNECTION LOST",

    "CONNECTION TIMEOUT",

    "CONNECTION REFUSED",

    "REMOTE CONNECTION FAILED",

    "SERVER CONNECTION FAILURE",

    "SERVER NOT RESPONDING",

    "NETWORK CONNECTION FAILURE",

    "NETWORK TIMEOUT",

    "HOST UNREACHABLE",

    "REMOTE HOST NOT FOUND",

    "SOCKET CONNECTION FAILURE",

    "TCP CONNECTION FAILED",

    "TCP SESSION LOST",

    "NETWORK SERVICE UNAVAILABLE"

];


/* =================================================
   DATABASE
================================================= */

const database = [

    "DATABASE ERROR",

    "DATABASE CONNECTION FAILURE",

    "DATABASE CORRUPTED",

    "DATABASE READ FAILURE",

    "DATABASE WRITE FAILURE",

    "DATABASE RESPONSE TIMEOUT",

    "DATABASE SERVICE UNAVAILABLE",

    "DATABASE INTEGRITY CHECK FAILED",

    "DATABASE TRANSACTION FAILED",

    "DATABASE QUERY FAILURE",

    "DATABASE LOCK FAILURE",

    "DATABASE RECOVERY FAILED"

];


/* =================================================
   DATA
================================================= */

const dataErrors = [

    "DATA CORRUPTED",

    "DATA READ FAILURE",

    "DATA WRITE FAILURE",

    "DATA STREAM INTERRUPTED",

    "DATA INTEGRITY FAILURE",

    "DATA VALIDATION FAILURE",

    "DATA TRANSMISSION ERROR",

    "DATA PACKET LOST",

    "DATA BUFFER ERROR",

    "DATA CHECKSUM FAILURE",

    "INVALID DATA RECEIVED",

    "CORRUPTED DATA BLOCK"

];


/* =================================================
   FILE
================================================= */

const fileErrors = [

    "FILE READ ERROR",

    "FILE WRITE ERROR",

    "FILE ACCESS FAILURE",

    "FILE CORRUPTED",

    "FILE NOT FOUND",

    "FILE SYSTEM ERROR",

    "STORAGE READ FAILURE",

    "STORAGE WRITE FAILURE",

    "DISK READ ERROR",

    "DISK WRITE ERROR",

    "IO DEVICE FAILURE",

    "INPUT OUTPUT ERROR"

];


/* =================================================
   PROCESS
================================================= */

const processErrors = [

    "PROCESS ERROR",

    "PROCESS NOT RESPONDING",

    "PROCESS TERMINATED",

    "PROCESS TIMEOUT",

    "PROCESS MEMORY ERROR",

    "THREAD FAILURE",

    "THREAD TIMEOUT",

    "MEMORY ACCESS ERROR",

    "MEMORY READ FAILURE",

    "MEMORY WRITE FAILURE",

    "BUFFER OVERFLOW",

    "RESOURCE ALLOCATION FAILURE"

];


/* =================================================
   NORMAL SYSTEM LOG
================================================= */

const normalLogs = [

    "SYSTEM INITIALIZING",

    "SYSTEM CHECK",

    "SYSTEM PROCESS RUNNING",

    "SYSTEM SERVICE STARTED",

    "SYSTEM SERVICE CHECK",

    "NETWORK SERVICE CHECK",

    "DATABASE SERVICE CHECK",

    "MEMORY CHECK",

    "STORAGE CHECK",

    "PROCESS MONITOR",

    "DATA STREAM",

    "DATA PROCESSING",

    "REQUEST PROCESSING",

    "SERVER RESPONSE",

    "CLIENT REQUEST",

    "NETWORK PACKET",

    "SERVICE RESPONSE",

    "SYSTEM MONITOR",

    "BACKGROUND PROCESS",

    "RESOURCE MONITOR",

    "PROCESS MONITORING",

    "CONNECTION MONITOR",

    "DATABASE MONITOR"

];


/* =================================================
   RANDOM
================================================= */

function random(min,max){

    return Math.floor(
        Math.random() *
        (max-min+1)
    ) + min;

}


function pick(arr){

    return arr[
        Math.floor(
            Math.random()*arr.length
        )
    ];

}


/* =================================================
   RANDOM ID
================================================= */

function id(){

    return Math
        .floor(
            Math.random()*999999
        )
        .toString()
        .padStart(6,"0");

}


/* =================================================
   TIME
================================================= */

function time(){

    const now =
        new Date();

    return (

        now
        .getHours()
        .toString()
        .padStart(2,"0")

        + ":" +

        now
        .getMinutes()
        .toString()
        .padStart(2,"0")

        + ":" +

        now
        .getSeconds()
        .toString()
        .padStart(2,"0")

    );

}


/* =================================================
   RANDOM HEX
================================================= */

function hex(){

    return Math
        .floor(
            Math.random()*16777215
        )
        .toString(16)
        .toUpperCase()
        .padStart(6,"0");

}


/* =================================================
   ABSURD DATA
================================================= */

function noise(){

    const chars =
        "0123456789ABCDEF";

    let result="";

    const length =
        random(10,50);


    for(
        let i=0;
        i<length;
        i++
    ){

        result +=
            chars[
                random(
                    0,
                    chars.length-1
                )
            ];

    }


    return result;

}


/* =================================================
   BUAT LOG
================================================= */

function makeLog(index){

    const el =
        document.createElement(
            "div"
        );


    el.className =
        "log";


    /* =========================================
       PILIH JENIS
    ========================================= */

    const chance =
        Math.random();


    let message;


    if(chance < .12){

        message =
            pick(errors);

        el.classList.add(
            "error"
        );

    }

    else if(chance < .24){

        message =
            pick(connections);

        el.classList.add(
            "error"
        );

    }

    else if(chance < .35){

        message =
            pick(database);

        el.classList.add(
            "error"
        );

    }

    else if(chance < .45){

        message =
            pick(dataErrors);

        el.classList.add(
            "error"
        );

    }

    else if(chance < .53){

        message =
            pick(fileErrors);

        el.classList.add(
            "error"
        );

    }

    else if(chance < .62){

        message =
            pick(processErrors);

        el.classList.add(
            "error"
        );

    }

    else{

        message =
            pick(normalLogs);

    }


    /* =========================================
       FORMAT SYSTEM LOG
    ========================================= */

    const format =
        "[" +
        time() +
        "] " +

        "[PID:" +
        random(100,9999) +
        "] " +

        message;


    /* =========================================
       DATA TAMBAHAN
    ========================================= */

    let suffix;


    if(
        Math.random() < .45
    ){

        suffix =
            " | CODE:" +
            hex();

    }

    else if(
        Math.random() < .35
    ){

        suffix =
            " | BLOCK:" +
            noise();

    }

    else{

        suffix =
            " | STATUS:" +
            (
                Math.random() < .5
                ? "FAILED"
                : "UNKNOWN"
            );

    }


    el.textContent =
        format +
        suffix;


    /* =========================================
       POSISI
    ========================================= */

    const row =
        (index / 75) * 100;


    el.style.top =
        row + "vh";


    /* =========================================
       RANDOM SIZE
    ========================================= */

    el.style.fontSize =
        random(10,16) + "px";


    /* =========================================
       RANDOM SPEED
    ========================================= */

    el.style.setProperty(

        "--speed",

        random(5,14) + "s"

    );


    /* =========================================
       RANDOM DIRECTION
    ========================================= */

    if(
        Math.random() < .5
    ){

        el.classList.add(
            "move-left"
        );

    }

    else{

        el.classList.add(
            "move-right"
        );

    }


    /* =========================================
       RANDOM FLICKER
    ========================================= */

    if(
        Math.random() < .06
    ){

        el.classList.add(
            "flicker"
        );

    }


    logs.appendChild(
        el
    );


    /* =========================================
       HAPUS
    ========================================= */

    setTimeout(

        ()=>{

            el.remove();

            makeLog(index);

        },

        random(
            6000,
            16000
        )

    );

}


/* =================================================
   BUAT 75 BARIS PENUH
================================================= */

for(
    let i=0;
    i<75;
    i++
){

    makeLog(i);

}


/* =================================================
   ALERT BESAR
================================================= */

function systemAlert(){

    const el =
        document.createElement(
            "div"
        );


    el.className =
        "system-alert";


    const types = [

        "CONNECTION FAILURE",

        "DATABASE CORRUPTED",

        "SYSTEM ERROR",

        "DATA INTEGRITY FAILURE",

        "SERVER NOT RESPONDING",

        "MEMORY ACCESS ERROR",

        "NETWORK FAILURE",

        "SYSTEM RECOVERY FAILURE",

        "PROCESS TERMINATED",

        "FATAL SYSTEM ERROR"

    ];


    el.textContent =
        pick(types);


    el.style.left =
        random(5,65) + "vw";


    el.style.top =
        random(10,85) + "vh";


    logs.appendChild(
        el
    );


    setTimeout(

        ()=>{

            el.remove();

        },

        random(
            500,
            1600
        )

    );

}


/* =================================================
   ALERT SESekali
================================================= */

setInterval(

    ()=>{

        if(
            Math.random() < .35
        ){

            systemAlert();

        }

    },

    1000

);


/* =================================================
   TAMBAHKAN BARIS BARU TERUS
================================================= */

setInterval(

    ()=>{

        const index =
            random(0,74);

        makeLog(index);

    },

    250

);


/* =================================================
   DOUBLE CLICK = FULLSCREEN
================================================= */

document.addEventListener(

    "dblclick",

    async ()=>{

        try{

            if(
                !document.fullscreenElement
            ){

                await
                document
                .documentElement
                .requestFullscreen();

            }

        }

        catch(e){

            console.log(e);

        }

    }

);


</script>

</body>

</html>
